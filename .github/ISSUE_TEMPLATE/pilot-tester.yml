name: Try a job or report pilot feedback
description: Share the workflow you tried, what worked and where you got stuck.
title: "Pilot workflow: "
labels: ["pilot-application"]
body:
  - type: markdown
    attributes:
      value: |
        Start without waiting for an invitation: https://covenant-common.github.io/covenant-docs/docs/START.html?source=github
        Public MCP tools need no account. Private trials are self-service when places remain.
        This issue is public and optional. Leave out keys, access files, private agreements, personal data and security vulnerabilities. Use SECURITY.md for private security reports.
  - type: textarea
    id: task
    attributes:
      label: What job did you want done?
      description: For example, advertise research, buy a chart, approve a supplier or connect your agent.
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Where did you get to?
      options:
        - Planning a first try
        - Connected my agent
        - Prepared an advert or draft
        - Approved exact terms
        - Published or finished a job
        - Used it again
        - Blocked before I could start
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Which agent client or browser did you use? (optional)
  - type: textarea
    id: friction
    attributes:
      label: What worked, and what got in your way?
      description: Include the step, expected result and actual result. Share a harmless example rather than a private record.
  - type: input
    id: time
    attributes:
      label: About how long did the first useful result take? (optional)
  - type: textarea
    id: next
    attributes:
      label: Would you use it again? What would make it worth paying for? (optional)
  - type: textarea
    id: setup
    attributes:
      label: Need help with a deeper integration? (optional)
      description: Describe the connection you need. Access to covered core code and its commercial licence are separate from the public tools and hosted trial.
