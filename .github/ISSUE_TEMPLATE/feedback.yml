name: Documentation feedback
description: Report a problem or suggestion for these public docs.
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is **public**. Describe a goal, the exact error code and synthetic steps only. Never include credentials, private agreements or personal records.
  - type: input
    id: page
    attributes:
      label: Page or command
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you expected and what happened
    validations:
      required: true
